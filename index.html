<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theoretical Number Generator</title>
  <style>
    /* ====== Base Styles ====== */
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0f6ff, #ffffff);
      color: #1c1c1c;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px 10px;
    }

    .card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      padding: 28px 24px;
      max-width: 420px;
      width: 100%;
      transition: 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
      transform: translateY(-2px);
    }

    h1 {
      color: #003366;
      font-size: 1.6rem;
      margin-bottom: 10px;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
      color: #003366;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #cdd9ed;
      background: #f8faff;
      font-size: 0.95rem;
      transition: border 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #0066ff;
      outline: none;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0066ff, #004de6);
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.25s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #004de6, #003bb5);
      transform: scale(1.02);
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎲 Theoretical Number Generator</h1>
    <p class="subtitle">A theoretical number generator based on first principles of number theory.<br>Created by <b>Sydwell Moiloa</b>.</p>

    <label>Maximum number of elements (≤ 50):</label>
    <input id="maxElements" type="number" value="50" />

    <label>How many numbers to select (k):</label>
    <input id="kSelect" type="number" value="5" />

    <label>How many sets to generate:</label>
    <input id="numSets" type="number" value="5" />

    <label>Configuration coverage (0–1):</label>
    <input id="coverage" type="number" step="0.1" value="0.9" />

    <label>Bias mode:</label>
    <select id="mode">
      <option value="soft">Soft (probabilistic)</option>
      <option value="hard">Hard (deterministic)</option>
    </select>

    <label>Soft-bias sigma (used only in soft mode):</label>
    <input id="sigma" type="number" value="5" />

    <label>Minimum first element (optional):</label>
    <input id="minFirst" type="number" placeholder="Leave blank" />

    <label>Maximum first element (optional):</label>
    <input id="maxFirst" type="number" placeholder="Leave blank" />

    <button onclick="generateSets()">Generate sets</button>

    <footer>© 2025 Theoretical Generator | Sydwell Moiloa</footer>
  </div>

  <script>
    function generateSets() {
      const maxElements = parseInt(document.getElementById('maxElements').value);
      const k = parseInt(document.getElementById('kSelect').value);
      const numSets = parseInt(document.getElementById('numSets').value);
      const mode = document.getElementById('mode').value;
      const sigma = parseFloat(document.getElementById('sigma').value);
      const minFirst = parseInt(document.getElementById('minFirst').value) || 1;
      const maxFirst = parseInt(document.getElementById('maxFirst').value) || maxElements;

      let sets = [];

      for (let s = 0; s < numSets; s++) {
        let numbers = new Set();
        while (numbers.size < k) {
          let n;
          if (mode === "soft") {
            let mean = (maxElements + 1) / 2;
            let rand = mean + sigma * (Math.random() * 2 - 1);
            n = Math.round(Math.min(Math.max(rand, 1), maxElements));
          } else {
            n = Math.floor(Math.random() * maxElements) + 1;
          }
          numbers.add(n);
        }
        let sorted = Array.from(numbers).sort((a, b) => a - b);
        if (sorted[0] < minFirst || sorted[0] > maxFirst) continue;
        sets.push(sorted.join(", "));
      }

      // Open in new tab
      let newWin = window.open("", "_blank");
      newWin.document.write(`
        <html><head><title>Generated Sets</title>
        <style>
          body { font-family: 'Segoe UI', sans-serif; background: #f9fbff; padding: 20px; color: #222; }
          h2 { color: #003366; }
          li { margin: 8px 0; }
          button { padding: 10px 16px; margin-top: 20px; background: #0066ff; color: white; border: none; border-radius: 8px; cursor: pointer; }
          button:hover { background: #004de6; }
        </style></head>
        <body>
          <h2>🎲 Generated Sets</h2>
          <ul>${sets.map((set, i) => `<li><b>Set ${i + 1}:</b> [${set}]</li>`).join('')}</ul>
          <button onclick="downloadSets()">Download as TXT</button>
          <script>
            function downloadSets() {
              const text = ${JSON.stringify(sets.join('\\n'))};
              const blob = new Blob([text], { type: 'text/plain' });
              const link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = 'generated_sets.txt';
              link.click();
            }
          </script>
        </body></html>
      `);
      newWin.document.close();
    }
  </script>
</body>
</html>
